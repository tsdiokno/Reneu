name: Release & Deployment Pipeline

on:
  release:
    types: [published] # Triggers when you publish a release via GitHub Releases UI
  push:
    tags:
      - 'v*' # Triggers when you push a semantic version tag (e.g. v1.3.1)
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version tag (e.g. v1.3.1)'
        required: true
        default: 'v1.3.1'

permissions:
  contents: write
  pull-requests: read

jobs:
  validate-and-release:
    name: Build & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type & Syntax Check
        run: npm run lint

      - name: Security Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Resolve Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          # Ensure semantic versioning prefix 'v' is present
          if [[ ! "$TAG" =~ ^v ]]; then
            TAG="v${TAG}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Resolved Release Tag: ${TAG}"

      - name: Build Production PWA & Assets
        env:
          VITE_GITHUB_RELEASE_TAG: ${{ steps.vars.outputs.tag }}
          VITE_GITHUB_REPO: ${{ github.repository }}
        run: npm run build

      - name: Publish GitHub Release (CLI / Dispatch only)
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Release ${{ steps.vars.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-vercel:
    name: Deploy to Vercel (Optional)
    needs: validate-and-release
    runs-on: ubuntu-latest
    # Only executes if VERCEL_TOKEN secret is configured; cleanly skips otherwise without failing
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel build --prod --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
