<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="page" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfbf7"/>
      <stop offset="100%" stop-color="#e7e5e4"/>
    </linearGradient>
  </defs>
  <!-- Background with subtle border -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Open Scripture Book Graphic -->
  <g transform="translate(96, 128)">
    <!-- Book Shadow -->
    <path d="M16 230 C 80 215, 140 215, 160 235 C 180 215, 240 215, 304 230 L 304 60 C 240 45, 180 45, 160 65 C 140 45, 80 45, 16 60 Z" fill="#000000" opacity="0.4"/>
    <!-- Left Page -->
    <path d="M16 220 C 75 206, 130 206, 156 226 L 156 56 C 130 36, 75 36, 16 50 Z" fill="url(#page)"/>
    <!-- Right Page -->
    <path d="M304 220 C 245 206, 190 206, 164 226 L 164 56 C 190 36, 245 36, 304 50 Z" fill="url(#page)"/>
    <!-- Book Spine & Gutter -->
    <path d="M156 56 L 164 56 L 164 226 L 156 226 Z" fill="#d6d3d1"/>
    
    <!-- Scholarly Text Lines Left Page -->
    <line x1="38" y1="80" x2="134" y2="80" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="38" y1="104" x2="134" y2="104" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="38" y1="128" x2="134" y2="128" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="38" y1="152" x2="134" y2="152" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="38" y1="176" x2="100" y2="176" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Scholarly Text Lines Right Page -->
    <line x1="186" y1="80" x2="282" y2="80" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="186" y1="104" x2="282" y2="104" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="186" y1="128" x2="282" y2="128" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="186" y1="152" x2="282" y2="152" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="186" y1="176" x2="248" y2="176" stroke="#78716c" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Gold Bookmark Ribbon -->
    <path d="M160 52 L 160 250 L 170 240 L 180 250 L 180 52 Z" fill="url(#gold)"/>
  </g>
  
  <!-- Subtle Cross Seal at Bottom Center -->
  <g transform="translate(256, 420)" opacity="0.85">
    <circle r="22" fill="#292524" stroke="url(#gold)" stroke-width="2"/>
    <line x1="0" y1="-12" x2="0" y2="12" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
    <line x1="-8" y1="-4" x2="8" y2="-4" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>